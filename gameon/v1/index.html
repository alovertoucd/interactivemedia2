<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Strikes</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Rolling Strikes</h1>
    </header>
    <section>
        <div class="battle-zone">
            <div class="player-info">
                <div class="icon"></div>
               <input class="player-name" type="text" placeholder="Player 1"> 
            </div>
            <div class="battle">
                <div class="monster"></div>
                <div class="hp">
                    <div class="hp-info">
                        <p>HP</p>
                        <p class="hpnum" id="player1-hp#">36/36</p>
                    </div>
                    <div class="health">
                        <div class="hp-bar" id="player1-hpbar">
                          <div class="hp-barinner" id="player1-hpbar"></div>   
                        </div> 
                    </div>
                    
                </div>
            </div>
        </div>

        <div class="battle-zone">
            <div class="player-info">
                <div class="icon"></div>
               <input class="player-name" type="text" placeholder="Player 2"> 
            </div>
            <div class="battle">
                <div class="monster"></div>
                <div class="hp">
                    <div class="hp-info">
                        <p>HP</p>
                        <p class="hpnum" id="player2-hp#">36/36</p>
                    </div>
                    <div class="health">
                        <div class="hp-bar" id="player2-hpbar">
                          <div class="hp-barinner" id="player2-hpbar"></div>   
                        </div> 
                    </div>
                    
                </div>
            </div>
        </div>
    </section>
</body>
</html>
